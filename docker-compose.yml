
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: housecarewiki-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://housecare:housecare_secret@postgres:5432/housecarewiki?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_SITE_URL=https://housecarewiki.com
      # Admin CMS login (/admin). Set ADMIN_PASSWORD in /opt/housecarewiki/.env on the server.
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Instagram automation (docs/instagram-automation.md). Stays a dry run until IG_DRY_RUN=0 is set.
      - IG_DRY_RUN=${IG_DRY_RUN:-1}
      - IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN:-}
      - IG_APP_SECRET=${IG_APP_SECRET:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - IG_VERIFY_TOKEN=${IG_VERIFY_TOKEN:-}
      - IG_TEST_USERNAMES=${IG_TEST_USERNAMES:-}
      - IG_TWO_STEP_DM=${IG_TWO_STEP_DM:-0}
      - IG_POLL_COMMENTS=${IG_POLL_COMMENTS:-0}
      - CRON_SECRET=${CRON_SECRET:-}
    volumes:
      # Also holds uploaded reels (.data/ig-media) that Instagram downloads at publish time.
      - app_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Runs the Instagram scheduler, token refresh and comment queue once a minute.
  ig-cron:
    image: curlimages/curl:8.10.1
    container_name: housecarewiki-ig-cron
    restart: unless-stopped
    environment:
      - CRON_SECRET=${CRON_SECRET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do sleep 60; curl -fsS -m 240 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://web:3000/api/instagram/tick > /dev/null || echo "tick failed"; done'
    depends_on:
      - web

  postgres:
    image: postgres:16-alpine
    container_name: housecarewiki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: housecare
      POSTGRES_PASSWORD: housecare_secret
      POSTGRES_DB: housecarewiki
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housecare -d housecarewiki"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: housecarewiki-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  app_data:
  pg_data:
  redis_data:
