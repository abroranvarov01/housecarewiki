# Nginx reverse proxy for housecarewiki.com (installed by deploy/remote-setup.sh).
# Canonical origin: https://housecarewiki.com (no www). Every other variant gets one 301 hop
# that keeps the path and query string.
# Security headers (HSTS, X-Frame-Options, etc.) are sent by Next.js (next.config.mjs), not here,
# so they are never duplicated.

# Persistent connections to the app: saves a TCP handshake per request (lower TTFB).
upstream housecarewiki_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Static assets cached on disk by nginx, so repeat hits never reach Node.
# Purged on every deploy by remote-setup.sh (editorial images are not content-hashed).
proxy_cache_path /var/cache/nginx/housecarewiki levels=1:2 keys_zone=housecarewiki_static:10m
                 max_size=1g inactive=30d use_temp_path=off;

# Keep-alive needs an empty Connection header; WebSocket upgrades still pass through.
map $http_upgrade $housecarewiki_connection {
    default upgrade;
    ''      '';
}

# HTTP -> HTTPS (both hosts). ACME challenges stay on HTTP for certificate renewal.
server {
    listen 80;
    listen [::]:80;
    server_name housecarewiki.com www.housecarewiki.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://housecarewiki.com$request_uri;
    }
}

# https://www -> https://apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.housecarewiki.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/housecarewiki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housecarewiki.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://housecarewiki.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name housecarewiki.com;

    ssl_certificate /etc/letsencrypt/live/housecarewiki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housecarewiki.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling: Let's Encrypt stopped running OCSP responders in 2025.

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript text/markdown application/xml application/json
               application/ld+json application/javascript application/rss+xml application/atom+xml
               application/manifest+json image/svg+xml font/ttf font/otf;

    # Brotli (~15-20% smaller than gzip) when the module is installed; remote-setup.sh writes this
    # file with brotli directives or leaves it empty, so nginx -t never fails on a missing module.
    include /etc/nginx/snippets/housecarewiki-brotli.conf;

    # If the app is down or restarting, answer 503 + Retry-After instead of 502: search engines treat
    # 503 as temporary and keep the pages indexed.
    error_page 502 504 =503 @unavailable;
    location @unavailable {
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
        return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Back shortly | HouseCareWiki</title></head><body><h1>HouseCareWiki is being updated</h1><p>Please try again in a couple of minutes.</p></body></html>';
    }

    # Never serve hidden files (.git, .env, ...), except ACME.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $housecarewiki_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Defense in depth: never let clients send Next.js' internal middleware header (CVE-2025-29927 class).
    proxy_set_header x-middleware-subrequest "";

    # Content-hashed build assets: immutable, cached for a year.
    location ^~ /_next/static/ {
        proxy_pass http://housecarewiki_app;
        proxy_cache housecarewiki_static;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Editorial images and icons: cached for 30 days (same as the Cache-Control Next.js sends).
    location ~ ^/(images/|favicon\.svg$|icon\.png$|apple-icon\.png$) {
        proxy_pass http://housecarewiki_app;
        proxy_cache housecarewiki_static;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://housecarewiki_app;
        proxy_cache_bypass $http_upgrade;
    }
}
