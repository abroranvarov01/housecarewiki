# Nginx reverse proxy for housecarewiki.com (installed by deploy/remote-setup.sh).
# Canonical origin: https://housecarewiki.com (no www). Every other variant gets one 301 hop
# that keeps the path and query string.
# Security headers (HSTS, X-Frame-Options, etc.) are sent by Next.js (next.config.mjs), not here,
# so they are never duplicated.

# HTTP -> HTTPS (both hosts). ACME challenges stay on HTTP for certificate renewal.
server {
    listen 80;
    listen [::]:80;
    server_name housecarewiki.com www.housecarewiki.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://housecarewiki.com$request_uri;
    }
}

# https://www -> https://apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.housecarewiki.com;

    ssl_certificate /etc/letsencrypt/live/housecarewiki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housecarewiki.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://housecarewiki.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name housecarewiki.com;

    ssl_certificate /etc/letsencrypt/live/housecarewiki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housecarewiki.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript
               application/rss+xml application/manifest+json image/svg+xml;

    # Never serve hidden files (.git, .env, ...), except ACME.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
